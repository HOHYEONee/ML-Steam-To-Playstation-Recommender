name: Median ALS confidence alpha sweep

on:
  push:
    branches:
      - experiment/game-median-als
    paths:
      - "src/models/als/als_median_alpha_sweep.py"
      - ".github/workflows/median-als-alpha-sweep.yml"
  workflow_dispatch:

jobs:
  steam-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        alpha: [2, 5, 10, 20]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2.2,<4" "scipy>=1.14,<2" "pyarrow>=18" "implicit==0.7.3"
      - name: Evaluate median ALS and Binary ALS at given alpha
        run: python -u src/models/als/als_median_alpha_sweep.py --phase grid --alpha ${{ matrix.alpha }}
      - name: Upload Steam grid scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-sweep-${{ matrix.alpha }}
          path: data/results/als_median_alpha_${{ matrix.alpha }}_grid.csv
          if-no-files-found: warn

  ps-evaluation:
    needs: steam-grid
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha-sweep-*
          merge-multiple: true
          path: data/results
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2.2,<4" "scipy>=1.14,<2" "pyarrow>=18" "implicit==0.7.3"
      - name: Select winner on Steam and evaluate PlayStation
        run: python -u src/models/als/als_median_alpha_sweep.py --phase ps
      - name: Upload full grid and PlayStation scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-sweep-final-results
          path: |
            data/results/als_median_alpha_full_grid.csv
            data/results/als_median_alpha_ps_test.csv
          if-no-files-found: warn
